<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosage Calculator</title>
<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:30px;
}
.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}
h2{
    color:#d71920;
}
label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
input[readonly]{
    background:#f0f0f0;
    color:#555;
}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.result{
    margin-top:25px;
    background:#fff5f5;
    padding:15px;
    border-radius:10px;
}
#dosage{
    color:#d71920;
    font-size:32px;
    font-weight:bold;
}
#formula{
    margin-top:15px;
    color:#555;
    font-size:14px;
}
</style>
</head>
<body>
<div class="card">
<h2>Actual Dosage Calculator</h2>
<label>Chemical</label>
<select id="chemical"></select>
<label>Density</label>
<input id="density" type="number" step="0.01" readonly>
<div class="row">
<div>
<label>Water Flow</label>
<input id="flow" type="number">
</div>
<div>
<label>Unit</label>
<select id="flowUnit">
<option value="m3/h">m³/h</option>
<option value="L/min">L/min</option>
</select>
</div>
</div>
<div class="row">
<div>
<label>Feed Rate</label>
<input id="feed" type="number">
</div>
<div>
<label>Unit</label>
<select id="feedUnit">
<option value="L/h">L/h</option>
<option value="mL/min">mL/min</option>
</select>
</div>
</div>
<label>% Dilution (ความเข้มข้นของสารที่ป้อนจริง, ถ้าไม่กรอก = 100%)</label>
<input id="dilution" type="number" step="0.1" placeholder="100">
<div class="result">
<h3>Dosage</h3>
<div id="dosage">-</div>
<div id="formula"></div>
</div>
</div>
<script>
const CUSTOM_KEY = "__custom__";
const chemicals = {
  "Gengard GN8020": 1.17,
  "Gengard GN7300": 1.58,
  "Flogard MS6207": 1.38,
  "Solisep MPT150": 1.02,
  "Spectrus NX1100": 1.11,
  "Spectrus NX1106": 1.03,
  "Biomate MBC2881": 1.27,
  "Hypersperse MDC759": 1.18,
  "Cortrol OS5300": 1.00,
  "Optisperse HP3100": 1.11,
  "Steamate NA0880": 1.00,
  "Hypersperse MDC704I": 1.14,
  "KLARAID IC1172": 1.34
};
const chemSelect = document.getElementById("chemical");
const densityBox = document.getElementById("density");

Object.keys(chemicals).forEach(name=>{
    let op=document.createElement("option");
    op.value=name;
    op.text=name;
    chemSelect.appendChild(op);
});
// Add custom option at the end
let customOp=document.createElement("option");
customOp.value=CUSTOM_KEY;
customOp.text="Custom (ใส่ค่าเอง)";
chemSelect.appendChild(customOp);

chemSelect.addEventListener("change",()=>{
    if(chemSelect.value===CUSTOM_KEY){
        densityBox.readOnly=false;
        densityBox.value="";
        densityBox.focus();
    }else{
        densityBox.readOnly=true;
        densityBox.value=chemicals[chemSelect.value];
    }
    calculate();
});

document.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",calculate);
});

function calculate(){
    let density=parseFloat(densityBox.value);
    let flow=parseFloat(document.getElementById("flow").value);
    let feed=parseFloat(document.getElementById("feed").value);
    let dilutionInput=document.getElementById("dilution").value;
    let dilution=dilutionInput===""?100:parseFloat(dilutionInput);
    if(isNaN(flow)||isNaN(feed)||isNaN(density)||isNaN(dilution)||dilution<=0){
        document.getElementById("dosage").innerHTML="-";
        document.getElementById("formula").innerHTML="";
        return;
    }
    // Flow
    let flowUnit=document.getElementById("flowUnit").value;
    if(flowUnit=="L/min")
        flow=flow*60;
    if(flowUnit=="m3/h")
        flow=flow*1000;
    // Feed
    let feedUnit=document.getElementById("feedUnit").value;
    if(feedUnit=="mL/min")
        feed=feed/1000*60;
    // Effective feed rate of pure chemical after % dilution
    let effectiveFeed=feed*(dilution/100);
    // ppm
    let ppm=(effectiveFeed*density*1000000)/flow;
    document.getElementById("dosage").innerHTML=
        ppm.toFixed(2)+" ppm";
    document.getElementById("formula").innerHTML=`
    <b>Calculation</b><br><br>
    Dosage =
    (Feed Rate × %Dilution ÷ 100 × Density × 1,000,000) ÷ Water Flow
    <br><br>
    = (${feed.toFixed(3)} × ${dilution}% × ${density} × 1,000,000)
      ÷ ${flow.toFixed(1)}
    <br><br>
    = <b>${ppm.toFixed(2)} ppm</b>
    `;
}
chemSelect.selectedIndex=0;
densityBox.value=chemicals[chemSelect.value];
</script>
</body>
</html>
